<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Avelã, o gatinho sobrevivente</title>
  <style>/* ==========================================================================
   Gatinho v0.1 — css/style.css
   Estilo para o jogo "Avelã, o gatinho sobrevivente" (Luísa, 7 anos)
   Paleta pastel, cantos arredondados, sem scroll de página.
   ========================================================================== */

/* --------------------------------------------------------------------------
   1. RESET / BASE — sem scroll nunca, tela cheia
   -------------------------------------------------------------------------- */
html,
body {
  margin: 0;
  padding: 0;
  height: 100%;
  overflow: hidden;
  /* fonte arredondada/amigável do sistema */
  font-family: 'Comic Sans MS', 'Segoe UI', system-ui, sans-serif;
  /* fundo suave e alegre */
  background: #eef3fb;
  color: #3a3a55;
  /* evita seleção de texto acidental (jogo) */
  -webkit-user-select: none;
  user-select: none;
  -webkit-tap-highlight-color: transparent;
}

/* --------------------------------------------------------------------------
   2. CAMADAS — #view (canvas 3D) por baixo, #ui (DOM) por cima
   -------------------------------------------------------------------------- */
#view {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  z-index: 1;
}

#ui {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  z-index: 10;
  /* a camada não intercepta toque; os filhos interativos reativam */
  pointer-events: none;
}

/* --------------------------------------------------------------------------
   3. TOQUE — impede rolagem/zoom do navegador ao arrastar
   -------------------------------------------------------------------------- */
canvas,
.joystick,
.joystick-base,
.joystick-alca,
.acoes,
.botao-acao,
.preview-arraste {
  touch-action: none;
}

/* --------------------------------------------------------------------------
   4. .tela — tela cheia, coluna centralizada, respeita bordas
   -------------------------------------------------------------------------- */
.tela {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 18px;
  padding: 24px;
  /* reativa toque para si e para os filhos interativos */
  pointer-events: auto;
  box-sizing: border-box;
  text-align: center;
}

/* títulos grandes e amigáveis */
.titulo {
  font-size: 2.2rem;
  font-weight: 700;
  margin: 0;
  color: #5b6bb0;
  text-shadow: 0 2px 0 rgba(255, 255, 255, 0.6);
}

.subtitulo {
  font-size: 1.1rem;
  margin: 0;
  color: #7a86b8;
}

/* --------------------------------------------------------------------------
   5. BOTÕES — grandes, fáceis de tocar, destaque ao :active / .selecionado
   -------------------------------------------------------------------------- */
.botao-grande,
.botao,
.botao-opcao {
  pointer-events: auto;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-height: 56px;
  min-width: 120px;
  padding: 12px 22px;
  font-family: inherit;
  font-size: 1.15rem;
  font-weight: 700;
  color: #3a3a55;
  background: #ffffff;
  border: 3px solid #cdd6f0;
  border-radius: 18px;
  cursor: pointer;
  box-shadow: 0 4px 0 #cdd6f0;
  transition: transform 0.08s ease, box-shadow 0.08s ease, background 0.15s ease;
}

/* grupo de botões do menu: uma coluna, largura consistente (js/menu.js) */
.botao-grupo {
  display: flex;
  flex-direction: column;
  align-items: stretch;
  gap: 14px;
  width: min(90vw, 320px);
  pointer-events: auto;
}

/* botão principal (destaque pastel) */
.botao-grande {
  background: #ffd9e8;
  border-color: #f7a8c6;
  box-shadow: 0 5px 0 #f7a8c6;
  min-width: 180px;
  font-size: 1.3rem;
}

/* ao pressionar: "afunda" */
.botao-grande:active,
.botao:active,
.botao-opcao:active {
  transform: translateY(4px);
  box-shadow: 0 0 0 #cdd6f0;
}

/* estado selecionado (criador) */
.botao-opcao.selecionado {
  background: #fff3c4;
  border-color: #f2c14e;
  box-shadow: 0 4px 0 #f2c14e;
  outline: 3px solid #ffe08a;
  outline-offset: 2px;
}

/* --------------------------------------------------------------------------
   6. .versao — pequeno, discreto, canto inferior direito
   -------------------------------------------------------------------------- */
.versao {
  position: absolute;
  right: 14px;
  bottom: 10px;
  font-size: 0.75rem;
  opacity: 0.5;
  pointer-events: none;
}

/* --------------------------------------------------------------------------
   7. CRIADOR — preview quadrado + controles com rolagem própria
   -------------------------------------------------------------------------- */
.creator-preview {
  width: min(60vw, 320px);
  height: min(60vw, 320px);
  display: flex;
  align-items: center;
  justify-content: center;
  background: rgba(255, 255, 255, 0.55);
  border: 3px dashed #cdd6f0;
  border-radius: 20px;
  overflow: hidden;
}

.preview-arraste {
  width: 100%;
  height: 100%;
  cursor: grab;
}

.creator-controles {
  width: min(92vw, 520px);
  max-height: 40vh;
  overflow-y: auto;
  display: flex;
  flex-direction: column;
  gap: 14px;
  padding: 14px;
  background: rgba(255, 255, 255, 0.7);
  border: 3px solid #cdd6f0;
  border-radius: 20px;
  pointer-events: auto;
}

/* rótulo de cada grupo de opções */
.creator-rotulo {
  font-size: 1rem;
  font-weight: 700;
  color: #5b6bb0;
  text-align: left;
}

/* linha com quebra dos botões de opção */
.creator-lista {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  justify-content: center;
}

/* campo de texto (nome do gatinho) — .creator-nome é o nome usado por js/creator.js */
.campo-nome,
.creator-nome {
  pointer-events: auto;
  min-height: 56px;
  width: min(80vw, 320px);
  padding: 12px 16px;
  font-family: inherit;
  font-size: 1.2rem;
  text-align: center;
  color: #3a3a55;
  background: #ffffff;
  border: 3px solid #cdd6f0;
  border-radius: 16px;
}

/* --------------------------------------------------------------------------
   8. JOYSTICK — canto inferior ESQUERDO
   -------------------------------------------------------------------------- */
.joystick {
  position: fixed;
  left: 20px;
  bottom: 20px;
  width: 130px;
  height: 130px;
  z-index: 20;
  pointer-events: auto;
}

.joystick-base {
  position: absolute;
  inset: 0;
  width: 130px;
  height: 130px;
  border-radius: 50%;
  background: rgba(255, 255, 255, 0.35);
  border: 3px solid rgba(120, 130, 180, 0.5);
}

.joystick-alca {
  position: absolute;
  left: 50%;
  top: 50%;
  width: 56px;
  height: 56px;
  margin-left: -28px;
  margin-top: -28px;
  border-radius: 50%;
  background: rgba(255, 217, 232, 0.9);
  border: 3px solid #f7a8c6;
  box-shadow: 0 3px 6px rgba(0, 0, 0, 0.15);
  /* JS aplica transform: translate(...) para mover a alca */
}

/* --------------------------------------------------------------------------
   9. AÇÕES — canto inferior DIREITO (Correr / Pular / Esconder)
   -------------------------------------------------------------------------- */
.acoes {
  position: fixed;
  right: 20px;
  bottom: 20px;
  z-index: 20;
  display: flex;
  flex-direction: column;
  gap: 12px;
  pointer-events: auto;
}

.botao-acao {
  width: 64px;
  height: 64px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  font-family: inherit;
  font-size: 0.7rem;
  font-weight: 700;
  color: #3a3a55;
  background: #ffffff;
  border: 3px solid #cdd6f0;
  border-radius: 50%;
  cursor: pointer;
  box-shadow: 0 4px 0 #cdd6f0;
  transition: transform 0.08s ease, box-shadow 0.08s ease;
}

.botao-acao:active {
  transform: translateY(4px);
  box-shadow: 0 0 0 #cdd6f0;
}

/* --------------------------------------------------------------------------
   10. HUD (mapa) — nome no topo, minimapa e pausa nos cantos
   -------------------------------------------------------------------------- */
#hud {
  position: fixed;
  inset: 0;
  z-index: 15;
  pointer-events: none;
}

.hud-nome {
  position: absolute;
  top: 14px;
  left: 50%;
  transform: translateX(-50%);
  padding: 8px 20px;
  font-size: 1.1rem;
  font-weight: 700;
  color: #3a3a55;
  background: rgba(255, 255, 255, 0.75);
  border: 3px solid #cdd6f0;
  border-radius: 16px;
  pointer-events: auto;
}

#minimapa {
  position: absolute;
  top: 14px;
  left: 14px;
  width: 120px;
  height: 120px;
  background: rgba(255, 255, 255, 0.7);
  border: 3px solid #cdd6f0;
  border-radius: 14px;
  pointer-events: auto;
}

#botao-pausa {
  position: absolute;
  top: 14px;
  right: 14px;
  min-height: 56px;
  min-width: 56px;
  padding: 8px 16px;
  font-family: inherit;
  font-size: 1.1rem;
  font-weight: 700;
  color: #3a3a55;
  background: #ffd9e8;
  border: 3px solid #f7a8c6;
  border-radius: 16px;
  cursor: pointer;
  box-shadow: 0 4px 0 #f7a8c6;
  pointer-events: auto;
}

#botao-pausa:active {
  transform: translateY(4px);
  box-shadow: 0 0 0 #f7a8c6;
}

/* aviso "em breve" (Esconder) — .aviso-central é o nome usado por js/main.js */
.aviso,
.aviso-central {
  position: fixed;
  left: 50%;
  bottom: 110px;
  transform: translateX(-50%);
  padding: 10px 20px;
  font-size: 1rem;
  font-weight: 700;
  color: #5b6bb0;
  background: rgba(255, 255, 255, 0.9);
  border: 3px solid #cdd6f0;
  border-radius: 16px;
  pointer-events: none;
}

/* --------------------------------------------------------------------------
   11. MEDIA QUERIES — telas pequenas / paisagem baixa
   -------------------------------------------------------------------------- */
/* celular em pé (estreito) */
@media (max-width: 480px) {
  .tela {
    gap: 12px;
    padding: 16px;
  }
  .titulo {
    font-size: 1.7rem;
  }
  .botao-grande,
  .botao,
  .botao-opcao {
    min-height: 52px;
    font-size: 1.05rem;
    padding: 10px 16px;
  }
  .creator-preview {
    width: min(70vw, 240px);
    height: min(70vw, 240px);
  }
  .creator-controles {
    max-height: 34vh;
    padding: 10px;
  }
  .joystick {
    width: 110px;
    height: 110px;
    left: 14px;
    bottom: 14px;
  }
  .joystick-base {
    width: 110px;
    height: 110px;
  }
  .joystick-alca {
    width: 48px;
    height: 48px;
    margin-left: -24px;
    margin-top: -24px;
  }
  .acoes {
    right: 14px;
    bottom: 14px;
  }
  .botao-acao {
    width: 56px;
    height: 56px;
  }
  #minimapa {
    width: 90px;
    height: 90px;
  }
}

/* paisagem baixa (pouca altura) */
@media (max-height: 480px),
(orientation: landscape) and (max-height: 520px) {
  .tela {
    gap: 10px;
    padding: 12px;
  }
  .titulo {
    font-size: 1.5rem;
  }
  .creator-preview {
    width: min(30vh, 220px);
    height: min(30vh, 220px);
  }
  .creator-controles {
    max-height: 46vh;
  }
}
